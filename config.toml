# The URL the site will be built for
base_url = "https://abhimanyusikarwar.com/"
title = "Abhimanyu Sikarwar"
description = "Abhimanyu Sikarwar, a software engineer in Bangalore building AI agent systems and MCP servers. Notes on programming, tech and life."
generate_feeds = false
feed_filenames = ["atom.xml"] # default template

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false
minify_html = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

taxonomies = [
  {name = "travel_tags", feed = true},
  {name = "tags", feed = true},
]

[markdown]
external_links_target_blank = true
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
# highlight_code = true
# highlight_theme = "one-dark"
render_emoji = false
smart_punctuation = true
[extra]
date_format="%d %b, %Y"
# Fallback social sharing image. Replace with a 1200x630 branded image when you have one.
default_og_image = "/images/website/profile.png"
# Longer, keyword-bearing title used only in the <title> tag on the homepage.
home_title = "Abhimanyu Sikarwar — AI Agents and MCP Servers"

[[extra.main_menu]]
name = "Posts"
url = "@/posts/_index.md"

[[extra.main_menu]]
name = "Projects"
url = "@/projects/_index.md"

[[extra.main_menu]]
name = "TIL"
url = "@/tils/_index.md"

[[extra.main_menu]]
name = "Resume"
url = "@/resume/index.md"
new_tab = true

[[extra.main_menu]]
name = "Contact"
url = "@/contact.md"
